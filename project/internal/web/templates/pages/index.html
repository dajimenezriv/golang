{{define "content"}}
<h1>Todos</h1>

<form
  hx-post="/todos"
  hx-target="#todo-list"
  hx-swap="beforeend"
  hx-on::after-request="this.reset()"
>
  <input name="title" placeholder="What needs doing?" required />
  <button type="submit">Add</button>
</form>

<ul id="todo-list">
  {{range .Todos}}{{template "todo_item" .}}{{end}}
</ul>
{{end}}
